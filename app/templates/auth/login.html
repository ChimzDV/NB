<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBridge - Secure Sign In</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Premium Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-page">

    <div class="glass-panel auth-card">
        
        <!-- Auth Header -->
        <div class="auth-header">
            <div style="font-size: 2.5rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; margin-bottom: 0.5rem; text-align: center;">
                <i class="fa-solid fa-bridge"></i> NovaBridge
            </div>
            <h1>Welcome Back</h1>
            <p>Enter your credentials to access your financial portal</p>
        </div>

        <!-- Secure Form -->
        <form method="POST" action="/login">
            
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 1.05rem; color: var(--text-muted);"></i>
                    <input type="email" id="email" name="email" class="form-input" style="padding-left: 2.75rem;" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 1.05rem; color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" class="form-input" style="padding-left: 2.75rem;" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In securely
            </button>

        </form>

        <!-- Redirect to Registration -->
        <div class="auth-footer">
            Don't have an account? 
            <a href="/register">Create one now</a>
        </div>

    </div>

</body>
</html>
