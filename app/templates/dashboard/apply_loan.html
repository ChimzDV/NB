{% extends "base.html" %}

{% block title %}NovaBridge - Apply For Loan{% endblock %}

{% block content %}
<div class="top-header">
    <h1 class="page-title">Loan Application</h1>
</div>

<div class="glass-panel form-container">
    <h2 style="font-size: 1.5rem; margin-bottom: 2rem; text-align: center; color: var(--primary-light);">
        <i class="fa-solid fa-file-invoice-dollar" style="margin-right: 0.5rem;"></i>
        New Loan Request
    </h2>

    <form method="POST" action="/apply-loan">
        
        <!-- Loan Amount -->
        <div class="form-group">
            <label class="form-label" for="loan_amount">Requested Loan Amount ($)</label>
            <input type="number" step="0.01" min="1" id="loan_amount" name="loan_amount" class="form-input" placeholder="e.g. 5000.00" required>
        </div>

        <!-- Purpose of Loan -->
        <div class="form-group">
            <label class="form-label" for="purpose">Purpose of Loan</label>
            <input type="text" id="purpose" name="purpose" class="form-input" placeholder="e.g. Education, Debt Consolidation, Home Renovation" required>
        </div>

        <!-- Due Date -->
        <div class="form-group">
            <label class="form-label" for="due_date">Desired Due Date</label>
            <input type="date" id="due_date" name="due_date" class="form-input" required>
        </div>

        <div style="margin-top: 2rem;">
            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i>
                Submit Loan Application
            </button>
        </div>

    </form>
</div>
{% endblock %}
